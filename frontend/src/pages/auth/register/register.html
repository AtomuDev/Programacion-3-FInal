<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Food Store - Registro">
    <meta name="author" content="Abel Tomás">
    <link rel="stylesheet" href="../../../styles/base.css">
    <link rel="stylesheet" href="../login/login.css">
    <title>Registro - Food Store</title>
</head>
<body>
    <!-- Main -->
    <main class="container">
        <form class="login-form" id="formRegistro">
            <h1>Food Store</h1>
            <h2>Registro</h2>

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre" autocomplete="off">

            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" required placeholder="Tu apellido" autocomplete="off">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="ejemplo@gmail.com" autocomplete="off">

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="off">

            <p id="errorMsg" style="display:none; color: var(--color-peligro, #bd1300); text-align:center;"></p>

            <button type="submit">Registrarse</button>

            <p>
                ¿Ya tenés cuenta? <a href="/src/pages/auth/login/login.html" class="register-link">Iniciá sesión</a>
            </p>
        </form>
    </main>

    <!-- Script -->
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="./register.ts"></script>
</body>
</html>
