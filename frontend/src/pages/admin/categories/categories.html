<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Food Store - Gestión de Categorías">
    <meta name="author" content="Abel Tomás">
    <link rel="stylesheet" href="../../../styles/base.css">
    <link rel="stylesheet" href="../../../styles/components.css">
    <link rel="stylesheet" href="../../../styles/admin-shared.css">
    <link rel="stylesheet" href="../adminHome/adminHome.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <title>Categorías - Food Store Admin</title>
</head>
<body class="admin-body">

    <!-- Header -->
    <header class="admin-header">
        <div class="container">
            <a href="/src/pages/admin/adminHome/adminHome.html" class="admin-header__title-link">
                <h1 class="admin-header__title">Food Store <span>Admin</span></h1>
            </a>
            <nav class="admin-header__nav">
                <a href="/src/pages/store/home/home.html">Ver Tienda</a>
                <button type="button" id="logoutButton">Salir</button>
            </nav>
        </div>
    </header>

    <div class="layout">

        <aside class="admin-sidebar">
            <p class="admin-sidebar__label">Administración</p>
            <nav class="admin-sidebar__nav">
                <ul class="admin-sidebar__list"></ul>
            </nav>
        </aside>

        <main class="admin-main">

            <section class="admin-section">
                <div class="admin-section__header">
                    <h2 class="admin-section__title">Gestión de Categorías</h2>
                    <button type="button" class="btn btn--primary" id="btn-nueva-categoria">+ Nueva Categoría</button>
                </div>

                <div class="table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Imagen</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Descripción</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-categorias"></tbody>
                    </table>
                </div>
            </section>

        </main>

    </div>

    <!-- Modal alta/edición -->
    <div class="modal-overlay" id="modal-categoria" style="display:none">
        <div class="modal">
            <button type="button" class="modal__close" id="modal-close">&times;</button>
            <h3 class="modal__title" id="modal-titulo">Nueva Categoría</h3>

            <form id="form-categoria">
                <input type="hidden" id="categoria-id">

                <div class="admin-form__group" style="margin-bottom: var(--espacio-md);">
                    <label class="admin-form__label" for="categoria-nombre">Nombre</label>
                    <input class="admin-form__input" type="text" id="categoria-nombre" maxlength="35" placeholder="Ej: Postres" required>
                </div>

                <div class="admin-form__group" style="margin-bottom: var(--espacio-md);">
                    <label class="admin-form__label" for="categoria-descripcion">Descripción</label>
                    <input class="admin-form__input" type="text" id="categoria-descripcion" maxlength="120" placeholder="Breve descripción">
                </div>

                <div class="admin-form__group" style="margin-bottom: var(--espacio-md);">
                    <label class="admin-form__label" for="categoria-imagen">URL de imagen</label>
                    <input class="admin-form__input" type="url" id="categoria-imagen" maxlength="500" placeholder="https://ejemplo.com/imagen.jpg">
                </div>

                <p class="modal__error" id="categoria-error"></p>

                <div class="modal__actions">
                    <button type="submit" class="btn btn--primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="admin-footer">
        <div class="container">
            <p>Panel de Administración &mdash; Food Store v1.0</p>
        </div>
    </footer>

    <!-- Script -->
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="./categories.ts"></script>
</body>
</html>
