<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Food Store - Carrito de Compras">
    <meta name="author" content="Abel Tomás">
    <link rel="stylesheet" href="../../../styles/base.css">
    <link rel="stylesheet" href="../../../styles/components.css">
    <link rel="stylesheet" href="./cart.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <title>Carrito - Food Store</title>
</head>
<body id="top">

    <!-- Header -->
    <header class="header">
        <div class="container">
            <a href="/src/pages/store/home/home.html" class="header__title-link">
                <h1 class="header__title">Food Store</h1>
            </a>
            <nav class="header__nav">
                <a href="/src/pages/store/home/home.html">Catálogo</a>
                <a href="/src/pages/client/orders/orders.html">Mis Pedidos</a>
                <a href="/src/pages/store/cart/cart.html" id="linkCarrito">Carrito</a>
                <a href="/src/pages/admin/adminHome/adminHome.html" id="linkAdmin" style="display:none">Administración</a>
                <button type="button" id="logoutButton">Salir</button>
            </nav>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="main">

        <!-- Sección carrito -->
        <section class="main__section">
            <div class="main__section-header">
                <h2 class="main__title">Mi Carrito</h2>
            </div>

            <div class="main__body">

                <!-- Lista de productos -->
                <div class="cart-list">
                    <div id="contenedor-carrito"></div>
                    <div id="carrito-vacio" class="cart-empty" style="display:none"></div>
                </div>

                <!-- Resumen del pedido -->
                <aside class="order-summary" id="order-summary">
                    <h3 class="order-summary__title">Resumen del pedido</h3>
                    <div class="order-summary__row">
                        <span>Subtotal</span>
                        <span id="summary-subtotal">$0</span>
                    </div>
                    <div class="order-summary__row">
                        <span>Envío</span>
                        <span id="summary-envio">$0</span>
                    </div>
                    <div class="order-summary__divider"></div>
                    <div class="order-summary__row order-summary__row--total">
                        <span>Total</span>
                        <span id="summary-total">$0</span>
                    </div>
                    <button type="button" id="btn-vaciar" class="btn-vaciar">Vaciar carrito</button>
                    <button type="button" class="btn-finalizar" id="btn-finalizar">Finalizar compra</button>
                </aside>

            </div>
        </section>

    </main>

    <!-- Modal de checkout -->
    <div class="modal-overlay" id="modal-checkout" style="display:none">
        <div class="modal">
            <button type="button" class="modal__close" id="modal-close">&times;</button>
            <div id="modal-body">
                <h3 class="modal__title">Completar pedido</h3>

                <div class="modal__group">
                    <label for="checkout-telefono">Teléfono</label>
                    <input type="tel" id="checkout-telefono" inputmode="tel" maxlength="20" placeholder="Ej: +54 9 11 1234-5678">
                </div>

                <div class="modal__group">
                    <label for="checkout-direccion">Dirección de entrega</label>
                    <input type="text" id="checkout-direccion" maxlength="50" placeholder="Calle, número, piso, depto">
                </div>

                <div class="modal__group">
                    <label for="checkout-pago">Método de pago</label>
                    <select id="checkout-pago">
                        <option value="" selected disabled>Seleccione un método</option>
                        <option value="EFECTIVO">Efectivo</option>
                        <option value="TARJETA">Tarjeta</option>
                        <option value="TRANSFERENCIA">Transferencia</option>
                    </select>
                </div>

                <div class="modal__group">
                    <label for="checkout-notas">Notas adicionales (opcional)</label>
                    <textarea id="checkout-notas" maxlength="300" placeholder="Instrucciones especiales, timbre, etc."></textarea>
                </div>

                <p class="modal__error" id="checkout-error"></p>

                <div class="modal__total">
                    <span>Total a pagar:</span>
                    <span id="checkout-total">$0</span>
                </div>

                <button type="button" class="btn-finalizar" id="btn-confirmar-pedido">Confirmar Pedido</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Food Store. Todos los derechos reservados.</p>
            <address>
                Contacto: <a href="mailto:info@foodstore.com">info@foodstore.com</a>
            </address>
        </div>
    </footer>

    <!-- Script -->
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="./cart.ts"></script>
</body>
</html>
